name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. `synchronize` fires on every push, so without
# this a branch pushed four times in an hour runs four full reviews — all but
# the last reviewing a diff that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # No author gate, unlike claude.yml. This is a `pull_request` trigger, and
    # GitHub withholds secrets from those when the PR comes from a fork — so a
    # passer-by cannot spend the owner's Claude quota here the way they could
    # through an issue comment. claude.yml runs on `issue_comment`, which does
    # get secrets, which is why it carries the author_association check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

