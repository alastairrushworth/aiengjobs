name: Deploy site to GitHub Pages

# No paths filter: engine-only pushes must still run the check job, and the
# nightly snapshot push rebuilds the site anyway.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh.yml. A push made with GITHUB_TOKEN does not trigger other
  # workflows, so the nightly snapshot commit would otherwise never rebuild the
  # site — the refresh job invokes this directly instead.
  workflow_call:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Fetch data snapshot
        run: npm run snapshot:fetch
      - name: Install dependencies
        run: npm ci
      - name: Typecheck engine
        run: npm run typecheck -w @aiengjobs/engine
      - name: Check site
        run: npm run check -w @aiengjobs/site
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Fetch data snapshot
        run: npm run snapshot:fetch
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build -w @aiengjobs/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: [build, check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
