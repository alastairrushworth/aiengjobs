name: Deploy site to GitHub Pages

# No paths filter: engine-only pushes must still run the check job, and the
# nightly snapshot push rebuilds the site anyway.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh.yml. A push made with GITHUB_TOKEN does not trigger other
  # workflows, so the nightly snapshot commit would otherwise never rebuild the
  # site — the refresh job invokes this directly instead.
  workflow_call:

# Read-only at workflow scope. `pages: write` + `id-token: write` live on the
# deploy job alone — declared here they were inherited by check and build, which
# only ever read.
permissions:
  contents: read

# One deploy at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Fetch data snapshot
        run: npm run snapshot:fetch
      - name: Install dependencies
        run: npm ci
      - name: Typecheck engine
        run: npm run typecheck -w @aiengjobs/engine
      - name: Check site
        run: npm run check -w @aiengjobs/site
      - name: Typecheck MCP server
        run: npm run typecheck -w @aiengjobs/mcp
      # tests/ and shared/ belong to no workspace, so nothing above reaches
      # them. vitest strips their types with esbuild rather than checking them.
      - name: Typecheck tests + shared
        run: npx tsc --noEmit -p tsconfig.json
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Fetch data snapshot
        run: npm run snapshot:fetch
      - name: Install dependencies
        run: npm ci
      - name: Build Astro site
        run: npm run build -w @aiengjobs/site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: [build, check]
    runs-on: ubuntu-latest
    # The only job that publishes, so the only one that needs these.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5